# Project Metadata
project_name: "Predictive_Maintenance_v1"
author: "Karan_Kishore"

# Data Paths
data:
  raw_path: "data/raw/ai4i2020.csv"
  processed_dir: "data/processed"
  current_version: "v1"

# Hyperparameters
model_params:
  algorithm: "RandomForest"
  n_estimators: 100
  max_depth: 10
  random_state: 42

# Deployment Settings
deployment:
  model_path: "models/model_v1.pkl"
  port: 5000
  threshold: 0.75
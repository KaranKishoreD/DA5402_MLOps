# Project Metadata
project_name: "Predictive_Maintenance_v1"
author: "Karan_Kishore"

# Data Paths
data:
  raw_path: "data/raw/ai4i2020.csv"
  processed_dir: "data/processed"
  train_size: 7000
  test_size: 3000
  current_version: "v3"

# Hyperparameters
model_params:
  algorithm: "RandomForest"
  n_estimators: 200
  max_depth: 10
  random_state: 42

# Deployment Settings
deployment:
  model_path: "models/model_v1.pkl"
  port: 5000
  threshold: 0.75

features:
  drop_columns:
    - "UDI"
    - "Product ID"
  target: "Machine failure"
  categorical:
    - "Type"
  scale_numeric: true

training:
  data_version: "v2"
  model_version: "v2"

# Project Metadata
project_name: "Predictive_Maintenance_v1"
author: "Karan_Kishore"

# Data Paths
data:
  raw_path: "data/raw/ai4i2020.csv"
  processed_dir: "data/processed"
  production_dir: "data/production"
  train_size: 7000
  test_size: 3000
  current_version: "v4"

# Hyperparameters
model_params:
  algorithm: "RandomForest"
  n_estimators: 200
  max_depth: 10
  random_state: 42

# Deployment Settings
deployment:
  model_path: "models/model_v1.pkl"
  port: 5000
  threshold: 0.75

features:
  drop_columns:
    - "UDI"
    - "Product ID"
  target: "Machine failure"
  categorical:
    - "Type"
  scale_numeric: true

training:
  data_version: "v4"
  model_version: "v4"

monitoring:
  prediction_log: "prediction_log.csv"
  day2_data: "data/production/day2_data.csv"
  error_threshold: 0.05

api:
  base_url: "http://127.0.0.1:8000"
  predict_endpoint: "/predict"
